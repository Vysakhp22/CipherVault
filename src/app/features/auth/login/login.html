<div class="w-full h-[100vh] bg-slate-900 text-white p-3 flex flex-col">
    <div class="w-full flex justify-between bg-slate-900 shadow-md">
        <div class="flex items-center gap-3">
            <img src="assets/images/logo.png" alt="Logo" class="h-10 w-10" />
            <div class="text-2xl font-medium">CipherVault</div>
        </div>
    </div>
    <div
        class="w-full flex items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white h-full">
        <div
            class="w-full max-w-md bg-slate-800/90 p-8 rounded-2xl shadow-xl shadow-blue-900/40 ring-1 ring-blue-500/20 hover:shadow-[0_0_30px_4px_rgba(59,130,246,0.3)] transition-all duration-300 flex flex-col justify-center">

            <img src="assets/images/logo.png" alt="CipherVault Logo"
                class="h-32 w-auto mx-auto mb-4 drop-shadow-[0_0_10px_rgba(59,130,246,0.5)]" />

            <h2 class="text-3xl font-bold text-center mb-2">Login to Your Account</h2>
            <p class="text-slate-400 text-center mb-6 text-sm tracking-wide">Securely manage and access your passwords
            </p>

            <form class="flex flex-col gap-4">
                <p-floatlabel variant="on" class="w-full">
                    <input class="w-full" pInputText id="over_label" autocomplete="off" />
                    <label for="over_label">Email</label>
                </p-floatlabel>
                <p-floatlabel variant="on" class="w-full">
                    <input type="password" class="w-full" pInputText id="over_label_password" autocomplete="off" />
                    <label for="over_label_password">Password</label>
                </p-floatlabel>
                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-6 rounded-lg text-lg mt-4 transition-all duration-200 active:scale-[0.98] shadow-[0_4px_10px_rgba(59,130,246,0.3)] hover:shadow-[0_0_20px_rgba(59,130,246,0.4)] cursor-pointer">
                    Login
                </button>

                <div class="text-center mt-4 text-sm text-slate-400">
                    Don’t have an account?
                    <a href="javascript:void(0)" class="text-blue-400 hover:text-blue-300 font-medium transition-colors" [routerLink]="['/', 'register']">Sign Up</a>
                </div>
            </form>
        </div>
    </div>
</div>
